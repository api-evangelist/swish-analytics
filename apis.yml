aid: swish-analytics
name: Swish Analytics
description: >-
  Swish Analytics is a machine-learning sports analytics company that prices and
  originates sportsbook markets. Its B2B API delivers hyper-accurate player-prop
  pricing, pre-match and in-play match/team markets, single and parlay (accumulator)
  bet-request pricing, and market results across NFL, NBA, MLB, NHL, NCAA basketball
  and football, ATP and WTA tennis, and soccer. The read-only JSON API is authenticated
  with an ApiKey header, supports multi-value filtering and incremental delta sync via
  a modifiedAtGreater timestamp, and is documented at docs.swishanalytics.com. Swish
  positions itself as a global leader in player-props pricing and odds origination,
  risk-management and trading software for U.S. sportsbooks.
