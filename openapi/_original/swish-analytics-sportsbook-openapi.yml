                  start:
                    type: number
                    nullable: true
                    description: Provides the integer value denoting the beginning of the duration associated with the associated
                      market
                  status:
                    type: number
                    description: Provides the value of yes (1) or no (0) for the denoted market status
                  type:
                    type: string
                    description: Provides the description denoting whether the associated market data is for a fractional
                      line or a integer line
                  under:
                    type: number
                    nullable: true
                    description: Provides the Under outcome price for the line attached to the specified market expressed
                      as a percentage in decimal form
                  value:
                    type: number
                    description: Provides the value to be used for resulting and settlement purposes for each market
                  void:
                    type: boolean
                    description: Provides the value identifying the returned result as either voided ( true ) or not voided
                      ( false )
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
